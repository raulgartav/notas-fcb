    /* Pulido visual: madera de banquillo, identidad blaugrana y microinteracciones */

    function pintarSync(){const b=document.querySelector('[data-action="datafile"]');if(!b)return;
      b.className='fs-badge '+(sync.estado==='error'?'warn':sync.estado==='ok'?'ready':'');b.innerHTML='<i></i>'+fsLabel();}
    function fsLabel(){if(!hayGrupo())return 'Solo este móvil';
      if(sync.estado==='subiendo')return 'Sincronizando…';
      if(sync.estado==='error')return 'Sin conexión';
      if(sync.estado==='ok'&&sync.cuando)return 'Al día · '+new Date(sync.cuando).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
      return 'Grupo conectado';}

    async function subir(opciones){if(!hayGrupo()||subiendo)return false;subiendo=true;
      try{const c=cfgSync();marcarSync('subiendo');
        for(let intento=0;intento<4;intento++){
          const res=await rpc('sala_guardar',{p_codigo:c.codigo,p_clave:c.clave,p_doc:db,p_rev:revRemota},opciones);
          if(res&&res.ok){revRemota=res.rev;marcarSync('ok');return true;}
          if(!res||!res.doc)throw new Error('Respuesta inesperada del servidor');
          revRemota=res.rev;adoptarRemoto(res.doc,true);
        }
        marcarSync('error','No se pudo cerrar la sincronización');return false;
      }catch(e){marcarSync('error',e.message||String(e));return false;}
      finally{subiendo=false;}}

    function adoptarRemoto(remoto,repintar){const fusionado=fusionar(db,remoto);
      const cambia=JSON.stringify(fusionado)!==JSON.stringify(db);
      db=fusionado;db.positions=db.positions||{};db.lastLineupText=db.lastLineupText||'';
      normalizeMatches(db.matches);
      if(!db.matches.some(m=>m.id===activeMatchId))activeMatchId=[...db.matches].sort((a,b)=>b.date.localeCompare(a.date))[0]?.id||'';
      guardarLocal();sombra=instantanea(db);
      if(cambia&&repintar!==false&&!document.querySelector('.overlay'))render();
      return cambia;}

    async function bajar(){const c=cfgSync();return await rpc('sala_leer',{p_codigo:c.codigo,p_clave:c.clave});}
    async function sincronizar(){if(!hayGrupo()||subiendo)return;
      try{const fila=await bajar();if(!fila)return;
        revRemota=fila.rev;
        const antes=JSON.stringify(db);
        adoptarRemoto(fila.doc);
        marcarSync('ok');
        if(JSON.stringify(db)!==JSON.stringify(fila.doc)||antes!==JSON.stringify(db))await subir();
      }catch(e){marcarSync('error',e.message||String(e));}}
    function arrancarPolling(){clearInterval(pullTimer);if(!hayGrupo())return;
      pullTimer=setInterval(()=>{if(document.visibilityState==='visible'&&!document.querySelector('.overlay'))sincronizar();},9000);}

    function adoptDb(next){db=next;db.positions=db.positions||{};db.lastLineupText=db.lastLineupText||'';normalizeMatches(db.matches);if(!db.matches.some(m=>m.id===activeMatchId))activeMatchId=[...db.matches].sort((a,b)=>b.date.localeCompare(a.date))[0]?.id||'';guardarLocal();sombra=instantanea(db);}
    async function loadFromDisk(){if(!hayGrupo()){toast('Este móvil no está en ningún grupo');return;}
      try{const fila=await bajar();if(!fila){toast('El grupo está vacío');return;}
        adoptarRemoto(fila.doc);revRemota=fila.rev;document.getElementById('modal-root').innerHTML='';render();toast('Actualizado desde el grupo');}
      catch(e){toast('No se pudo leer del grupo');}}

    /* -- confirmaciones: en el móvil no hay diálogos del sistema, se pintan dentro -- */
    function confirmAction(mensaje,titulo,okLabel){return new Promise(resolve=>{
      const root=document.getElementById('modal-root');const previo=root.innerHTML;
      root.innerHTML='<div class="overlay"><div class="modal small"><h2>'+escapeHtml(titulo||'¿Seguro?')+'</h2><p>'+escapeHtml(mensaje)+'</p><div class="modal-actions"><button class="secondary" data-c="no">Cancelar</button><button class="primary" data-c="si">'+escapeHtml(okLabel||'Aceptar')+'</button></div></div></div>';
      const cerrar=v=>{root.innerHTML=(v===null?previo:'');resolve(!!v);};
      root.querySelector('[data-c="si"]').addEventListener('click',()=>cerrar(true));
      root.querySelector('[data-c="no"]').addEventListener('click',()=>cerrar(false));});}

    function whoBtn(){const u=userById(currentUser);return '<button class="who" data-action="switch-user" title="Cambiar de usuario"><span class="dot" style="background:'+(u?u.color:'#33415c')+'">'+(u?u.initials:'?')+'</span><span class="who-pre">Notas de </span><strong>'+escapeHtml(u?u.name:'invitado')+'</strong></button>';}

    async function bootDisk(){sombra=instantanea(db);guardarLocal();
      if(hayGrupo()){await sincronizar();arrancarPolling();}}
    function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
    function formatDate(date){return new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(date+'T12:00:00')).replace('.','');}
    function validRating(value){return Number.isFinite(Number(value))&&Number(value)>=1&&Number(value)<=10&&Math.abs(Number(value)*4-Math.round(Number(value)*4))<0.000001;}
    function formatRating(value){const n=Number(value);return Number.isFinite(n)&&n>=1&&n<=10?n.toFixed(2).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1').replace('.',','):'—';}
    function isConfirmedBy(m,uid){return !!(m.confirmed&&m.confirmed[uid]);}
    function confirmedCount(m){return USERS().filter(u=>isConfirmedBy(m,u.id)).length;}
    function isFinal(m){return nUsers()>0&&m.participants.length>0&&USERS().every(u=>isConfirmedBy(m,u.id));}
    function startersOf(m){return m.participants.filter(p=>p.role!=='sub');}
    function ratedAllBy(m,uid){return m.participants.length>0&&m.participants.every(p=>validRating(m.ratings[p.playerId]?.[uid]));}
    function lockedForMe(m){return !!currentUser&&isConfirmedBy(m,currentUser);}
    function canConfirm(m){return !!currentUser&&!isConfirmedBy(m,currentUser)&&startersOf(m).length===11&&ratedAllBy(m,currentUser);}
    function confirmBlockReason(m){if(!currentUser)return 'Entra a editar para confirmar tus notas.';if(isConfirmedBy(m,currentUser))return 'Ya has confirmado tus notas en este partido.';const st=startersOf(m).length;if(st!==11)return 'Necesitas 11 titulares en el campo (ahora hay '+st+').';const falta=m.participants.filter(p=>!validRating(m.ratings[p.playerId]?.[currentUser])).length;return falta?('Te faltan notas de '+falta+' jugador(es).'):'Listo para confirmar.';}
    function normalizeMatches(list){(list||[]).forEach(m=>{m.participants=m.participants||[];m.ratings=m.ratings||{};if(!m.confirmed){const all=m.participants.length>0&&m.participants.every(p=>USERS().every(u=>validRating(m.ratings[p.playerId]?.[u.id])));const stamp=all?new Date().toISOString():null;m.confirmed={};USERS().forEach(u=>{m.confirmed[u.id]=stamp;});}});return list;}
    function revokeStaleConfirmations(m){if(!m.confirmed)return;const lost=USERS().filter(u=>isConfirmedBy(m,u.id)&&!ratedAllBy(m,u.id));lost.forEach(u=>{m.confirmed[u.id]=null;if(m.postFinalEdits)m.postFinalEdits[u.id]=[];});if(lost.length)toast('Se ha reabierto la confirmación de '+lost.map(u=>u.name).join(' y ')+' por el cambio de alineación.');}
    function statusText(m){const n=confirmedCount(m),t=nUsers();return (t&&n===t)?'Finalizado':n?'Confirmado '+n+'/'+t:'Editando';}
    function sortedMatches(){return [...db.matches].sort((a,b)=>b.date.localeCompare(a.date));}
    function toast(message){const root=document.getElementById('toast-root');root.innerHTML='<div class="toast">'+escapeHtml(message)+'</div>';setTimeout(()=>root.innerHTML='',2400)}
    function initialsAvatar(p,small=false){return '<span class="'+(small?'roster-avatar':'avatar')+(p.position==='POR'?' gk':'')+'">'+(p.photo?'<img src="'+p.photo+'" alt="'+escapeHtml(p.name)+'" onerror="this.parentNode.textContent=\''+escapeHtml(p.initials)+'\'">':escapeHtml(p.initials))+'</span>';}
    function render(){const nu=Math.max(1,nUsers());document.documentElement.style.setProperty('--nu',String(nu));document.documentElement.style.setProperty('--nu1',String(nu+1));document.getElementById('app').innerHTML='<div class="app"><aside class="sidebar '+(sidebarOpen?'open':'')+'">'+renderSidebar()+'</aside><main class="main">'+renderTopbar()+(page==='stats'?renderStats():page==='calendar'?renderCalendar():renderMatchPage())+'</main></div>'; document.getElementById('modal-root').innerHTML=''; bindEvents();}
    function renderSidebar(){const matches=sortedMatches();const pending=matches.filter(m=>!isFinal(m)).length;return '<div class="brand"><div class="crest">FCB</div><div><strong>Blaugrana Ratings</strong><span>Temporada 2026/27</span></div></div><nav class="side-nav"><button class="nav-btn '+(page==='matches'?'active':'')+'" data-action="home"><span class="nav-left">◈ <span>Partidos</span></span><span class="pending-count">'+pending+'</span></button><button class="nav-btn '+(page==='stats'?'active':'')+'" data-action="stats"><span class="nav-left">▥ <span>Estadísticas</span></span></button><button class="nav-btn '+(page==='calendar'?'active':'')+'" data-action="calendar"><span class="nav-left">◷ <span>Calendario</span></span></button><button class="nav-btn" data-action="last"><span class="nav-left">↯ <span>Último encuentro</span></span><span>›</span></button><button class="nav-btn" data-action="abrir-grupo"><span class="nav-left">☺ <span>Grupo</span></span></button></nav><div class="eyebrow">Histórico oficial</div><div class="matches">'+(matches.length?matches.map(renderMatchItem).join(''):'<div class="empty-side">No hay partidos todavía.</div>')+'</div><div class="eyebrow">Herramientas</div><button class="source-btn" data-action="source">↻ &nbsp; Fuente y decisiones técnicas</button>'}
    function renderMatchItem(m){const done=isFinal(m);return '<button class="match-item '+(page==='matches'&&m.id===activeMatchId?'active':'')+'" data-match="'+m.id+'"><div class="match-top"><span>'+formatDate(m.date)+'</span><span class="match-score">'+m.homeScore+'–'+m.awayScore+'</span></div><div class="match-opponent">'+escapeHtml(m.opponent)+'</div><div class="match-meta"><i class="dot '+(done?'done':'pending')+'"></i>'+statusText(m)+' · '+escapeHtml(m.competition)+'</div><span class="match-actions"><span class="mini-action" data-action="edit" data-id="'+m.id+'" title="Editar y puntuar">✎</span><span class="mini-action" data-action="delete" data-id="'+m.id+'" title="Eliminar partido">×</span></span></button>';}
    function renderTopbar(){return '<header class="topbar"><div class="topbar-left"><button class="icon-btn mobile-menu" data-action="menu">☰</button>'+((page==='matches'&&displayMode==='edit'&&currentUser)?whoBtn():'')+'</div><div class="top-actions"><button class="fs-badge ready" data-action="datafile"><i></i>'+fsLabel()+'</button><button class="secondary" data-action="backup">⛊ Seguridad</button><button class="primary" data-action="new">Añadir partido</button></div></header>';}
    function renderMatchPage(){const m=db.matches.find(x=>x.id===activeMatchId)||sortedMatches()[0];if(!m)return '<div class="surface note-box">No hay partidos. Crea uno para empezar.</div>';const fin=isFinal(m);const editing=displayMode==='edit'&&!!currentUser;const mine=lockedForMe(m);const free=editing&&!mine;const left=(POST_FINAL_EDIT_LIMIT-postFinalEditsUsed(m).length);const tools='<div class="section-tools"><span class="pill '+(fin?'done':'pending')+'">● '+statusText(m)+'</span>'+(editing&&currentUser?(mine?'<span class="pill done">✓ Confirmadas · '+left+' correcciones</span>':'<button class="primary'+(canConfirm(m)?'':' is-muted')+'" data-action="confirm-notes" title="'+escapeHtml(confirmBlockReason(m))+'">Confirmar notas</button>'):'')+'</div>';return '<section class="section-label"><div><h1>'+(editing?'Valorar actuación':'Resultado')+'</h1><p>'+(editing?(mine?'Ya confirmaste tus notas. Solo puedes gastar tus correcciones.':'Coloca a los participantes, registra sus acciones y puntúa desde cada ficha.'):(fin?'Las notas de todos ya son visibles.':'Las notas siguen siendo privadas hasta que confirméis todos.'))+'</p></div>'+tools+'</section>'+'<div class="match-head"><div class="match-card">'+renderMatchCard(m,editing)+'</div></div>'+renderPitchArea(m,!free)+(free?renderRoster(m):(fin?renderResultsHint(m):renderPendingPanel(m)));}
    function renderMatchCard(m,canEdit){const home=m.homeTeam||'FC Barcelona',away=m.awayTeam||m.opponent;return '<div class="match-card-top"><span class="pill">'+escapeHtml(m.competition)+'</span><span class="pill">'+formatDate(m.date)+' · '+escapeHtml(m.stadium||'Estadio pendiente')+'</span>'+(canEdit?'<button class="pill edit-data" data-action="edit-data" title="Editar resultado y datos del partido">✎ Datos</button>':'')+'</div><div class="match-versus"><div class="team-side"><div class="team-name">'+escapeHtml(home)+'</div><small>LOCAL</small></div><div class="score-big">'+m.homeScore+' <span style="color:var(--muted)">–</span> '+m.awayScore+'</div><div class="team-side"><div class="team-name">'+escapeHtml(away)+'</div><small>VISITANTE</small></div></div><div class="match-subline">'+(m.participants.length?m.participants.length+' participantes registrados':'Alineación pendiente de registrar')+'</div>'+(m.notes?'<div class="match-notes">'+escapeHtml(m.notes)+'</div>':'');}
    function renderPitchArea(m,readonly){const fin=isFinal(m);const editing=displayMode==='edit'&&!!currentUser;const mine=lockedForMe(m);const left=(POST_FINAL_EDIT_LIMIT-postFinalEditsUsed(m).length);const starters=m.participants.filter(p=>p.role!=='sub');const subs=m.participants.filter(p=>p.role==='sub');markTopNote(m);return '<div class="surface pitch-wrap"><div class="pitch-head"><strong>Terreno de juego</strong><span>'+ (readonly?'Vista de resultados · arrastre bloqueado':'Arrastra las fichas para ordenar tu once')+'</span>'+(editing&&!mine?'':'<span class="pitch-legend">'+USERS().map(u=>'<i style="--uc:'+u.color+'">'+escapeHtml(u.name)+'</i>').join('')+'</span>')+'</div><div class="pitch'+(pitchVertical()?' vertical':'')+'" id="pitch"><span class="pitch-line mid"></span><span class="pitch-circle"></span><span class="pitch-box left"></span><span class="pitch-box right"></span><span class="pitch-box small left"></span><span class="pitch-box small right"></span><span class="pitch-goal left"></span><span class="pitch-goal right"></span><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>'+ starters.map(p=>renderPlayerCard(m,p,readonly,false)).join('')+'</div></div><div class="bench-wrap"><div class="bench-top"><strong>Banquillo</strong><span>Entraron como cambios · '+subs.length+'</span></div><div class="bench">'+subs.map(p=>renderPlayerCard(m,p,readonly,true)).join('')+'</div></div><div class="hint">'+(editing?(mine?'Ya confirmaste tus notas. Puedes corregir hasta '+POST_FINAL_EDIT_LIMIT+' jugadores · te quedan '+left+'.':'Tu nota es privada hasta que confirméis todos. Solo tú ves la tuya.'):(fin?'Las notas son visibles para todos porque el partido está finalizado.':'Las notas siguen ocultas hasta que confirméis todos vuestras puntuaciones.'))+'</div>'}
    function ratingStrip(m,pid,coupons){const r=m.ratings[pid]||{};const fin=isFinal(m);const pl=playerById(pid);return '<div class="rating-users">'+USERS().map(u=>{const own=u.id===currentUser;if(own&&coupons){return canEditRating(m,pid)?'<span class="own" style="--uc:'+u.color+'"><b>'+u.initials+'</b><input class="rating-mini" type="number" min="1" max="10" step="0.25" inputmode="decimal" value="'+(r[u.id]??'')+'" data-rating-final="'+pid+'" aria-label="Corregir nota de '+escapeHtml(pl?pl.name:'')+'"></span>':'<span class="own locked" style="--uc:'+u.color+'" title="Ya has gastado tus '+POST_FINAL_EDIT_LIMIT+' correcciones"><b>'+u.initials+'</b>'+formatRating(r[u.id])+'</span>';}const show=fin?formatRating(r[u.id]):(validRating(r[u.id])?'✓':'·');return '<span style="--uc:'+u.color+'"><b>'+u.initials+'</b>'+show+'</span>';}).join('')+'</div>';}
    const NOMBRE_CORTO={p1:'Joan',p10:'Lamine',p18:'G. Martín',p21:'De Jong',p24:'Eric',p7:'Fermín',p9:'Jesus',p29:'Hamza'};

    function renderPlayerCard(m,part,readonly,bench){const p=playerById(part.playerId);if(!p)return '';const r=m.ratings[p.id]||{};const fin=isFinal(m);const editing=displayMode==='edit'&&!!currentUser;const mine=editing&&isConfirmedBy(m,currentUser);const free=editing&&!mine;const big=!free;const icons='⚽'.repeat(part.goals||0)+(part.goals&&part.assists?' ':'')+'👟'.repeat(part.assists||0);const body=free?'<input class="rating-input" type="number" min="1" max="10" step="0.25" inputmode="decimal" value="'+(r[currentUser]??'')+'" placeholder="—" data-rating="'+p.id+'" aria-label="Nota de '+escapeHtml(p.name)+'">':'<div class="rating-average'+(fin?'':' empty')+'">'+(fin?average(r):'—')+'</div>'+ratingStrip(m,p.id,mine);return '<div class="player-card '+(part.role==='sub'?'sub ':'')+(p.position==='POR'?'gk ':'')+(big?'result ':'')+(part.topNote?'top-note':'')+'" data-player="'+p.id+'" data-participant="1" '+(!bench?'style="'+cardPos(part.x,part.y,big)+'"':'')+'>'+('<span class="card-number">'+p.number+'</span>')+initialsAvatar(p)+'<span class="card-name" title="'+escapeHtml(p.name)+'">'+escapeHtml(pitchVertical()?shortName(p):p.name)+'</span><span class="card-icons'+(icons?' has':'')+'">'+(icons||'·')+'</span>'+'<div class="card-rating">'+body+'</div></div>';}
    function renderPendingPanel(m){const total=m.participants.length;return '<section class="surface results-panel"><div class="section-label"><div><h2>Estado de las notas</h2><p>Las notas de cada uno se muestran cuando haya confirmado todo el grupo.</p></div><span class="pill">'+confirmedCount(m)+'/'+nUsers()+' confirmadas</span></div><div class="roster-grid">'+USERS().map(u=>{const rated=m.participants.filter(p=>validRating(m.ratings[p.playerId]?.[u.id])).length;const ok=isConfirmedBy(m,u.id);return '<div class="roster-row"><div class="roster-player"><span style="width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;color:#fff;flex:none;background:'+u.color+'">'+u.initials+'</span><div style="min-width:0"><div class="roster-name">'+escapeHtml(u.name)+'</div><div class="roster-role">'+(ok?'Confirmado':rated+' de '+total+' puntuados')+'</div></div></div><span class="pill '+(ok?'done':'pending')+'">'+(ok?'✓':'…')+'</span></div>';}).join('')+'</div></section>';}
    /* En el móvil en vertical el campo se pone de pie: x (profundidad) va de abajo arriba e y (banda) de izquierda a derecha. */

    function cardPos(x,y,big){const vx=Number.isFinite(Number(x))?Number(x):50,vy=Number.isFinite(Number(y))?Number(y):50;if(pitchVertical()){const px=37,py=big?47:40;return 'left:clamp('+px+'px,'+vy+'%,calc(100% - '+px+'px));top:clamp('+py+'px,'+(100-vx)+'%,calc(100% - '+py+'px))';}const px=big?54:49,py=big?58:51;return 'left:clamp('+px+'px,'+vx+'%,calc(100% - '+px+'px));top:clamp('+py+'px,'+vy+'%,calc(100% - '+py+'px))';}

    function renderRoster(m){return '<section class="surface roster-section"><div class="section-label"><div><h2>Plantilla y acciones</h2><p>Ordenada por dorsal · añade titulares, cambios, goles y asistencias.</p></div><span class="pill">'+m.participants.length+' / '+players.length+' seleccionados</span></div><div class="roster-grid">'+players.map(p=>renderRosterRow(m,p)).join('')+'</div><div class="data-foot"><span>Los datos de plantilla se basan en la página oficial del primer equipo.</span><a class="source-link" href="https://www.fcbarcelona.com/en/football/first-team/squad" target="_blank" rel="noreferrer">Ver fuente oficial ↗</a></div></section>';}
    function renderRosterRow(m,p){const part=m.participants.find(x=>x.playerId===p.id);return '<div class="roster-row"><div class="roster-player">'+initialsAvatar(p,true)+'<span class="jersey">'+p.number+'</span><div style="min-width:0"><div class="roster-name">'+escapeHtml(p.name)+'</div><div class="roster-role">'+p.position+(part?' · '+(part.role==='sub'?'cambio':'titular'):'')+'</div></div></div><div class="roster-actions">'+(part?'<span class="stat-chip"><button class="tiny" data-action="goal-minus" data-id="'+p.id+'">−</button><span>⚽'+(part.goals||0)+'</span><button class="tiny" data-action="goal-plus" data-id="'+p.id+'">＋</button></span><span class="stat-chip"><button class="tiny" data-action="assist-minus" data-id="'+p.id+'">−</button><span>👟'+(part.assists||0)+'</span><button class="tiny" data-action="assist-plus" data-id="'+p.id+'">＋</button></span><button class="tiny active" data-action="role" data-id="'+p.id+'" title="Cambiar titular/cambio">↳</button><button class="tiny" data-action="remove" data-id="'+p.id+'" title="Eliminar">−</button>':'<button class="tiny" data-action="add" data-id="'+p.id+'" title="Añadir como titular">＋</button><button class="tiny" data-action="sub" data-id="'+p.id+'" title="Añadir como cambio">↳</button>')+'</div></div>';}
    function markTopNote(m){let best=null,bestVal=-1;m.participants.forEach(p=>{p.topNote=false;if(!isFinal(m))return;const vals=USERS().map(u=>Number((m.ratings[p.playerId]||{})[u.id])).filter(validRating);if(!vals.length)return;const a=vals.reduce((x,y)=>x+y,0)/vals.length;if(a>bestVal){bestVal=a;best=p;}});if(best)best.topNote=true;}
    function renderResultsHint(m){

    function layoutStarters(list){const groups={POR:[],DEF:[],MED:[],ATA:[]};list.forEach(f=>(groups[f.p.position]||groups.MED).push(f));const xs={POR:8,DEF:26,MED:52,ATA:80};const out=[];Object.keys(groups).forEach(pos=>{const arr=groups[pos];arr.forEach((f,i)=>{const saved=db.positions[f.p.id];const y=arr.length===1?50:Math.round(14+(i/(arr.length-1))*72);out.push(saved?{...f,x:saved[0],y:saved[1]}:{...f,x:xs[pos],y});});});return out;}
    function parsePastedLineup(text){const found=[];let section=null;
      String(text||'').split(/[\n;,]+/).forEach(raw=>{let line=raw.trim();if(!line)return;const low=line.toLowerCase();
        if(/(alineaci|once inicial|titulares|starting|formaci)/.test(low))section='starter';
        if(/(suplent|banquillo|substitut|cambios|sustitucion|reservas)/.test(low))section='sub';
        let goals=0,assists=0;
        line=line.replace(/\+\s*g(?:ol(?:es)?)?\b/gi,()=>{goals++;return ' ';}).replace(/\+\s*a(?:sist(?:encia)?s?)?\b/gi,()=>{assists++;return ' ';});
        goals+=(line.match(/⚽/g)||[]).length;assists+=(line.match(/👟/g)||[]).length;
        line=line.replace(/[⚽👟]/g,' ').replace(/[0-9'’·\-–|()]/g,' ');
        if(!line.trim())return;const p=matchPlayer(line);if(!p)return;
        const prev=found.find(f=>f.p.id===p.id);
        if(prev){prev.goals+=goals;prev.assists+=assists;if(section==='sub')prev.section='sub';return;}
        found.push({p,goals,assists,section});});
      if(!found.length)return null;
      const tagged=found.some(f=>f.section);
      let starters,subs;
      if(tagged){starters=found.filter(f=>f.section!=='sub').slice(0,11);subs=found.filter(f=>!starters.includes(f));}
      else{starters=found.slice(0,11);subs=found.slice(11);}
      return [...layoutStarters(starters).map(f=>({playerId:f.p.id,role:'starter',x:f.x,y:f.y,positionVersion:2,goals:f.goals,assists:f.assists})),...subs.map(f=>{const nat=rememberedPos(f.p.id)||[50,50];return {playerId:f.p.id,role:'sub',x:nat[0],y:nat[1],positionVersion:2,goals:f.goals,assists:f.assists};})];}
    function createMatch(e){e.preventDefault();const f=new FormData(e.target),opponent=f.get('opponent').trim(),venue=f.get('venue'),barca=Number(f.get('barcaScore')||0),opp=Number(f.get('oppScore')||0),id='manual-'+Date.now();const m={id,date:f.get('date'),opponent,competition:f.get('competition'),stadium:f.get('stadium').trim()||autoStadium(opponent,venue)||'Estadio pendiente',venue,homeTeam:venue==='home'?'FC Barcelona':opponent,awayTeam:venue==='home'?opponent:'FC Barcelona',homeScore:venue==='home'?barca:opp,awayScore:venue==='home'?opp:barca,notes:f.get('notes').trim(),participants:[],ratings:{},createdAt:Date.now()};const lineupText=f.get('lineup')||'';const pasted=parsePastedLineup(lineupText);if(lineupText.trim())db.lastLineupText=lineupText.replace(/\+\s*g(?:ol(?:es)?)?\b/gi,'').replace(/\+\s*a(?:sist(?:encia)?s?)?\b/gi,'').split('\n').map(l=>l.replace(/[ \t]+$/,'')).join('\n');if(pasted){m.participants=pasted;pasted.forEach(p=>{m.ratings[p.playerId]=emptyRatings();});}db.matches.push(m);save();activeMatchId=id;page='matches';displayMode='edit';document.getElementById('modal-root').innerHTML='';toast(pasted?'Partido creado con '+pasted.length+' jugadores':'Partido creado');render();}

    const POST_FINAL_EDIT_LIMIT=3;
    function postFinalEditsUsed(m){return (m.postFinalEdits&&m.postFinalEdits[currentUser])||[];}
    function canEditRating(m,playerId){if(!lockedForMe(m))return true;const used=postFinalEditsUsed(m);return used.includes(playerId)||used.length<POST_FINAL_EDIT_LIMIT;}
    function setRating(id,value,rerender=true){const m=getActive();if(!m||!currentUser)return;const parsed=Number(String(value??'').replace(',','.'));if(!Number.isFinite(parsed))return;const n=Math.min(10,Math.max(1,Math.round(parsed*4)/4));const locked=lockedForMe(m);if(locked&&(m.ratings[id]||{})[currentUser]!==n){if(!canEditRating(m,id)){render();toast('Ya has gastado tus '+POST_FINAL_EDIT_LIMIT+' correcciones en este partido.');return;}m.postFinalEdits=m.postFinalEdits||{raul:[],nico:[],papa:[]};const used=m.postFinalEdits[currentUser]=m.postFinalEdits[currentUser]||[];if(!used.includes(id))used.push(id);}m.ratings[id]=m.ratings[id]||emptyRatings();m.ratings[id][currentUser]=n;save();if(rerender||locked)render();}
    async function confirmNotes(){const m=getActive();if(!m||!currentUser)return;if(!canConfirm(m)){toast(confirmBlockReason(m));return;}if(!await confirmAction('Al confirmar, tus notas quedan cerradas: después solo podrás cambiar '+POST_FINAL_EDIT_LIMIT+' jugadores con tus correcciones. ¿Confirmar?','Confirmar notas','Confirmar'))return;m.confirmed=m.confirmed||emptyRatings();m.confirmed[currentUser]=new Date().toISOString();save();render();toast(isFinal(m)?'Notas confirmadas · partido finalizado':'Notas confirmadas');}
    /* ---- Grupo: quiénes puntúan, quién soy en este móvil y cómo se comparte ---- */
    const ALFABETO='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    function claveAleatoria(n){let o='';const a=new Uint8Array(n);crypto.getRandomValues(a);for(let i=0;i<n;i++)o+=ALFABETO[a[i]%ALFABETO.length];return o;}
    let grupoPaso='inicio',grupoBorrador=null,grupoAviso='';

    function abrirModalGrupo(paso){grupoAviso='';grupoPaso=paso||(nUsers()?'personas':'inicio');
      grupoBorrador=nUsers()?USERS().map(u=>u.name):['','',''];
      pintarGrupo();}
    function cerrarModalGrupo(){grupoBorrador=null;document.getElementById('modal-root').innerHTML='';}
    function avisoGrupo(txt,tono){grupoAviso=txt?('<div class="surface note-box" style="margin-top:12px'+(tono==='mal'?';border-color:rgba(239,68,68,.45)':'')+'">'+escapeHtml(txt)+'</div>'):'';pintarGrupo();}

    function filasNombres(){if(!Array.isArray(grupoBorrador))grupoBorrador=nUsers()?USERS().map(u=>u.name):['','',''];
      return '<div class="g-personas">'+grupoBorrador.map((n,i)=>'<div class="g-fila"><span class="g-num" style="background:'+PALETA[i%PALETA.length]+'">'+(i+1)+'</span><input class="g-nombre" data-idx="'+i+'" type="text" autocomplete="off" autocapitalize="words" placeholder="Nombre" value="'+escapeHtml(n)+'">'+(grupoBorrador.length>1?'<button class="tiny" data-g="quitar-fila" data-idx="'+i+'" aria-label="Quitar">×</button>':'')+'</div>').join('')+'</div>'+(grupoBorrador.length<MAX_USUARIOS?'<button class="secondary" data-g="anadir-fila" style="margin-top:10px">+ Añadir persona</button>':'');}

    function pintarGrupo(){const c=cfgSync();const inv=codigoInvitacion();let cuerpo='';
      if(grupoPaso==='inicio'){
        cuerpo='<p>Esta app la podéis usar entre varios, cada uno desde su móvil. Empieza creando el grupo o únete a uno que ya exista.</p>'
          +'<div class="modal-actions" style="justify-content:flex-start;flex-wrap:wrap"><button class="primary" data-g="ir-nuevo">Crear un grupo</button><button class="secondary" data-g="ir-unir">Unirme con un código</button><button class="secondary" data-g="ir-solo">Solo en este móvil</button></div>'
          +'<div class="hint" style="margin-top:14px">'+(hayServidor()?'Servidor de sincronización configurado.':'Todavía no hay servidor configurado: podrás usarla en solitario y conectar la sincronización más tarde.')+' <button class="tiny" data-g="ir-servidor">Ajustes del servidor</button></div>';
      } else if(grupoPaso==='nuevo'||grupoPaso==='solo'){
        cuerpo='<p>¿Quiénes van a puntuar? Escribe un nombre por persona. Podrás cambiarlos después sin perder nada.</p>'+filasNombres()
          +'<div class="modal-actions"><button class="secondary" data-g="volver">Atrás</button><button class="primary" data-g="'+(grupoPaso==='solo'?'guardar-solo':'crear')+'">'+(grupoPaso==='solo'?'Guardar':'Crear grupo')+'</button></div>';
      } else if(grupoPaso==='unir'){
        cuerpo='<p>Pide a quien creó el grupo su código y pégalo aquí. Lo que haya ahora en este móvil se sustituirá por los datos del grupo.</p>'
          +'<div class="form-grid"><div class="field full"><label>Código del grupo</label><input id="g-codigo" type="text" autocomplete="off" autocapitalize="characters" placeholder="ABCD1234-XXXXXXXXXXXX"></div></div>'
          +'<div class="modal-actions"><button class="secondary" data-g="volver">Atrás</button><button class="primary" data-g="unirme">Unirme</button></div>';
      } else if(grupoPaso==='servidor'){
        cuerpo='<p>Datos del proyecto de Supabase que hace de servidor. Se guardan solo en este móvil.</p>'
          +'<div class="form-grid"><div class="field full"><label>URL del proyecto</label><input id="g-url" type="url" autocomplete="off" placeholder="https://xxxx.supabase.co" value="'+escapeHtml(c.url)+'"></div>'
          +'<div class="field full"><label>Clave pública (anon)</label><input id="g-anon" type="text" autocomplete="off" placeholder="eyJ…" value="'+escapeHtml(c.anon)+'"></div></div>'
          +'<div class="modal-actions"><button class="secondary" data-g="volver">Atrás</button><button class="primary" data-g="guardar-servidor">Guardar</button></div>';
      } else {
        const yo=userById(currentUser);
        cuerpo='<p>Personas que puntúan en este grupo. El nombre se puede cambiar cuando quieras; las notas ya puestas se conservan.</p>'+filasNombres()
          +'<div class="eyebrow" style="margin-top:20px">Quién soy en este móvil</div><div class="identity-grid">'+USERS().map(u=>'<button class="identity'+(u.id===currentUser?' activa':'')+'" data-g="soy" data-user="'+u.id+'"><span class="avatar" style="background:'+u.color+'">'+escapeHtml(u.initials)+'</span><strong>'+escapeHtml(u.name)+'</strong></button>').join('')+'</div>'
          +(yo?'':'<div class="hint" style="margin-top:8px">Elige quién eres para poder puntuar.</div>')
          +'<div class="eyebrow" style="margin-top:20px">Compartir</div>'
          +(inv?'<div class="surface note-box"><strong style="color:var(--text)">Código del grupo</strong><br><code class="g-codigo-grande">'+escapeHtml(inv)+'</code><br>Quien lo tenga puede unirse desde su móvil y ver y poner notas.<div class="disk-row"><button class="secondary" data-g="compartir">Compartir código</button><button class="secondary" data-g="sincronizar">Sincronizar ahora</button><button class="secondary" data-g="salir">Salir del grupo</button></div></div>'
            :'<div class="surface note-box">Este móvil guarda solo en su propia memoria.<div class="disk-row"><button class="secondary" data-g="ir-nuevo-sala">Crear grupo compartido</button><button class="secondary" data-g="ir-unir">Unirme con un código</button><button class="secondary" data-g="ir-servidor">Ajustes del servidor</button></div></div>')
          +'<div class="modal-actions"><button class="secondary" data-g="cerrar">Cerrar</button><button class="primary" data-g="guardar-personas">Guardar cambios</button></div>';
      }
      document.getElementById('modal-root').innerHTML='<div class="overlay"><div class="modal"><h2>Tu grupo</h2>'+cuerpo+grupoAviso+'</div></div>';
      bindGrupo();}

    function leerNombres(){document.querySelectorAll('.g-nombre').forEach(el=>{grupoBorrador[Number(el.dataset.idx)]=el.value;});}
    function nombresValidos(){const l=grupoBorrador.map(n=>String(n||'').trim()).filter(Boolean);return l;}

    function aplicarPersonas(){const nombres=nombresValidos();
      if(!nombres.length){avisoGrupo('Escribe al menos un nombre.','mal');return false;}
      const previos=USERS();
      const nuevos=nombres.map((nombre,i)=>{const antiguo=previos[i];
        return antiguo?{...antiguo,name:nombre,initials:inicialesDe(nombre,previos.filter((_,j)=>j!==i).map(p=>p.initials)),color:antiguo.color||PALETA[i%PALETA.length]}:null;});
      const ids=nuevos.filter(Boolean).map(u=>u.id);
      const completo=nuevos.map((u,i)=>{if(u)return u;const id=idDeNombre(nombres[i],ids);ids.push(id);
        return {id,name:nombres[i],initials:inicialesDe(nombres[i],ids.map(x=>x.toUpperCase())),color:PALETA[i%PALETA.length]};});
      db.users=completo;db.usersAt=Date.now();
      if(currentUser&&!completo.some(u=>u.id===currentUser)){currentUser='';localStorage.removeItem(ME_KEY);}
      db.matches.forEach(m=>{m.confirmed=m.confirmed||{};completo.forEach(u=>{if(!(u.id in m.confirmed))m.confirmed[u.id]=null;});});
      save();return true;}

    async function crearSala(){if(!hayServidor()){grupoPaso='servidor';avisoGrupo('Primero configura el servidor: pega la URL y la clave pública de tu proyecto.','mal');return false;}
      try{const nombre=(USERS().map(u=>u.name).join(', ')||'Grupo');
        const res=await rpc('sala_crear',{p_nombre:nombre});
        if(!res||!res.codigo)throw new Error('El servidor no devolvió un código');
        guardarCfgSync({codigo:res.codigo,clave:res.clave,grupo:nombre});
        revRemota=null;await subir();arrancarPolling();return true;}
      catch(e){avisoGrupo('No se pudo crear el grupo: '+(e.message||e),'mal');return false;}}

    async function unirseSala(){const txt=document.getElementById('g-codigo')?.value||'';
      const partes=partirInvitacion(txt);
      if(!partes){avisoGrupo('Ese código no tiene la forma esperada.','mal');return;}
      if(!hayServidor()){grupoPaso='servidor';avisoGrupo('Primero configura el servidor.','mal');return;}
      const previo=cfgSync();guardarCfgSync(partes);
      try{const fila=await bajar();
        if(!fila){guardarCfgSync({codigo:previo.codigo,clave:previo.clave});avisoGrupo('No existe ningún grupo con ese código.','mal');return;}
        guardarCfgSync({grupo:fila.nombre||''});
        adoptDb(fila.doc&&fila.doc.matches?fila.doc:db);revRemota=fila.rev;
        currentUser='';localStorage.removeItem(ME_KEY);
        marcarSync('ok');arrancarPolling();
        grupoBorrador=USERS().map(u=>u.name);grupoPaso='personas';
        avisoGrupo('Listo: este móvil ya está en el grupo. Elige quién eres.');
        render();pintarGrupo();}
      catch(e){guardarCfgSync({codigo:previo.codigo,clave:previo.clave});avisoGrupo('No se pudo entrar: '+(e.message||e),'mal');}}

    function bindGrupo(){const root=document.getElementById('modal-root');
      root.querySelectorAll('[data-g]').forEach(el=>el.addEventListener('click',async e=>{e.stopPropagation();const a=el.dataset.g;
        if(a==='ir-nuevo'||a==='ir-nuevo-sala'){leerSiHay();grupoBorrador=nUsers()?USERS().map(u=>u.name):['','',''];grupoPaso=a==='ir-nuevo-sala'&&nUsers()?'crear-sala-directa':'nuevo';
          if(grupoPaso==='crear-sala-directa'){grupoPaso='personas';if(await crearSala()){avisoGrupo('Grupo creado. Comparte el código con los demás.');}return;}
          grupoAviso='';pintarGrupo();return;}
        if(a==='ir-unir'){grupoPaso='unir';grupoAviso='';pintarGrupo();return;}
        if(a==='ir-solo'){grupoBorrador=nUsers()?USERS().map(u=>u.name):['','',''];grupoPaso='solo';grupoAviso='';pintarGrupo();return;}
        if(a==='ir-servidor'){leerSiHay();grupoPaso='servidor';grupoAviso='';pintarGrupo();return;}
        if(a==='volver'){grupoPaso=nUsers()?'personas':'inicio';if(nUsers())grupoBorrador=USERS().map(u=>u.name);grupoAviso='';pintarGrupo();return;}
        if(a==='anadir-fila'){leerNombres();grupoBorrador.push('');pintarGrupo();return;}
        if(a==='quitar-fila'){leerNombres();grupoBorrador.splice(Number(el.dataset.idx),1);pintarGrupo();return;}
        if(a==='guardar-solo'||a==='guardar-personas'){leerNombres();if(!aplicarPersonas())return;render();
          if(a==='guardar-solo'){grupoPaso='personas';avisoGrupo('Guardado. Puedes conectar la sincronización cuando quieras.');}
          else{avisoGrupo('Cambios guardados.');}
          grupoBorrador=USERS().map(u=>u.name);pintarGrupo();return;}
        if(a==='crear'){leerNombres();if(!aplicarPersonas())return;render();grupoPaso='personas';grupoBorrador=USERS().map(u=>u.name);
          if(await crearSala())avisoGrupo('Grupo creado. Comparte el código con los demás y elige quién eres.');
          else pintarGrupo();
          return;}
        if(a==='unirme'){await unirseSala();return;}
        if(a==='guardar-servidor'){const url=document.getElementById('g-url')?.value||'';const anon=document.getElementById('g-anon')?.value||'';
          guardarCfgSync({url:url.trim().replace(/\/+$/,''),anon:anon.trim()});
          grupoPaso=nUsers()?'personas':'inicio';if(nUsers())grupoBorrador=USERS().map(u=>u.name);
          avisoGrupo(hayServidor()?'Servidor guardado.':'Faltan datos del servidor.',hayServidor()?'':'mal');return;}
        if(a==='soy'){currentUser=el.dataset.user;localStorage.setItem(ME_KEY,currentUser);render();
          grupoBorrador=USERS().map(u=>u.name);avisoGrupo('En este móvil eres '+(userById(currentUser)?.name||''));return;}
        if(a==='compartir'){const inv=codigoInvitacion();
          try{if(navigator.share){await navigator.share({title:'Notas FCB',text:'Únete a mi grupo de notas con este código: '+inv});return;}}catch(err){if(err&&err.name==='AbortError')return;}
          try{await navigator.clipboard.writeText(inv);avisoGrupo('Código copiado.');}catch(err){avisoGrupo('Copia el código a mano: '+inv);}
          return;}
        if(a==='sincronizar'){avisoGrupo('Sincronizando…');await sincronizar();render();grupoBorrador=USERS().map(u=>u.name);avisoGrupo(sync.estado==='error'?('No se pudo sincronizar: '+sync.detalle):'Al día.',sync.estado==='error'?'mal':'');return;}
        if(a==='salir'){if(!await confirmAction('Este móvil dejará de compartir notas con el grupo. Los datos que ya tiene se quedan aquí.','Salir del grupo','Salir'))  {pintarGrupo();return;}
          guardarCfgSync({codigo:'',clave:'',grupo:''});revRemota=null;clearInterval(pullTimer);marcarSync('solo');
          grupoBorrador=USERS().map(u=>u.name);grupoPaso='personas';avisoGrupo('Has salido del grupo.');return;}
        if(a==='cerrar'){cerrarModalGrupo();return;}
      }));}
    function leerSiHay(){if(grupoBorrador&&document.querySelector('.g-nombre'))leerNombres();}

    function necesitaConfiguracion(){return !nUsers()||!currentUser||!userById(currentUser);}
    function askIdentity(matchId){if(!nUsers()){abrirModalGrupo();return;}
      if(matchId&&currentUser&&userById(currentUser)){activeMatchId=matchId;page='matches';displayMode='edit';render();return;}
      pendingEditId=matchId||null;document.getElementById('modal-root').innerHTML=renderIdentityModal();bindIdentity();}
    function bindEvents(){document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();const a=el.dataset.action,id=el.dataset.id;if(a==='menu'){sidebarOpen=!sidebarOpen;render();return}if(a==='home'){page='matches';sidebarOpen=false;render();return}if(a==='stats'){page='stats';sidebarOpen=false;render();return}if(a==='calendar'){page='calendar';sidebarOpen=false;render();loadCalendar();return}if(a==='calendar-retry'){loadCalendar();return}if(a==='last'){const next=sortedMatches().find(m=>!isFinal(m))||sortedMatches()[0];if(next){activeMatchId=next.id;page='matches';displayMode='results';sidebarOpen=false;render();}return}if(a==='new'){openNewModal();return}if(a==='edit-data'){openEditMatchModal();return}if(a==='backup'||a==='datafile'){openBackupModal();return}if(a==='abrir-grupo'){abrirModalGrupo();return}if(a==='switch-user'){askIdentity(null);return}if(a==='catchup'){catchUp();return}if(a==='source'){openSourceModal();return}if(a==='close-modal'){document.getElementById('modal-root').innerHTML='';return}if(a==='edit'){sidebarOpen=false;askIdentity(id);return}if(a==='confirm-notes'){confirmNotes();return}if(a==='delete'){deleteMatch(id);return}if(['add','sub','remove','role','goal-plus','goal-minus','assist-plus','assist-minus'].includes(a))mutateParticipant(a,id);}));document.querySelectorAll('[data-match]').forEach(el=>el.addEventListener('click',()=>{if(el.dataset.action)return;activeMatchId=el.dataset.match;page='matches';displayMode='results';sidebarOpen=false;render();}));document.querySelectorAll('[data-rating]').forEach(input=>input.addEventListener('input',()=>setRating(input.dataset.rating,input.value,false)));document.querySelectorAll('.player-card[data-participant]').forEach(card=>bindDrag(card));document.querySelectorAll('[data-calendar-idx]').forEach(el=>el.addEventListener('click',()=>addFromCalendar(Number(el.dataset.calendarIdx))));}
    async function deleteMatch(id){const m=db.matches.find(x=>x.id===id);if(!m)return;if(!await confirmAction('¿Eliminar el partido contra '+m.opponent+'? Esta acción no se puede deshacer.','Eliminar partido','Eliminar'))return;db.matches=db.matches.filter(x=>x.id!==id);if(activeMatchId===id)activeMatchId=sortedMatches()[0]?.id||'';save();render();toast('Partido eliminado');}
    function bindIdentity(){document.querySelectorAll('[data-user]').forEach(el=>el.addEventListener('click',()=>{currentUser=el.dataset.user;localStorage.setItem(ME_KEY,currentUser);const target=pendingEditId;pendingEditId=null;if(target){activeMatchId=target;page='matches';displayMode='edit';}render();toast((target?'Editando como ':'Sesión iniciada como ')+userById(currentUser).name);}));}
    function bindDrag(card){const m=getActive();if(!m||!currentUser||lockedForMe(m)||displayMode==='results'||card.closest('.bench'))return;let dragging=false;const id=card.dataset.player;const onMove=e=>{if(!dragging)return;const pitch=document.getElementById('pitch'),r=pitch.getBoundingClientRect();const v=pitchVertical(),fx=v?1-(e.clientY-r.top)/r.height:(e.clientX-r.left)/r.width,fy=v?(e.clientX-r.left)/r.width:(e.clientY-r.top)/r.height;const x=Math.max(6,Math.min(94,fx*100)),y=Math.max(8,Math.min(92,fy*100));const p=m.participants.find(x=>x.playerId===id);if(!p)return;p.x=x;p.y=y;card.style.cssText=card.style.cssText.replace(/left:[^;]*;?top:[^;]*;?/,'')+';'+cardPos(x,y,false);};card.addEventListener('pointerdown',e=>{if(e.target.closest('input,button'))return;dragging=true;card.setPointerCapture?.(e.pointerId);card.style.cursor='grabbing';});card.addEventListener('pointermove',onMove);card.addEventListener('pointerup',()=>{if(dragging){dragging=false;card.style.cursor='';const p=m.participants.find(x=>x.playerId===id);if(p)rememberPos(id,p.x,p.y);save();toast('Posición guardada · se usará en los próximos partidos');}});}
    document.getElementById('modal-root').addEventListener('click',e=>{if(e.target.closest('[data-action="close-modal"]'))document.getElementById('modal-root').innerHTML='';if(e.target.closest('[data-action="run-auto"]'))runAutomaticSync();if(e.target.closest('[data-action="export-db"]'))exportDb();if(e.target.closest('[data-action="import-db"]'))importDb();if(e.target.closest('[data-action="disk-save"]'))writeDisk(true);if(e.target.closest('[data-action="disk-load"]'))loadFromDisk();if(e.target.closest('[data-action="abrir-grupo"]'))abrirModalGrupo();if(e.target.closest('[data-action="save-key"]'))saveApiKey();if(e.target.closest('[data-action="import-fixtures"]'))importFixtures();if(e.target.closest('[data-action="proposed"]'))applyProposedLineup(getActive());});
    document.addEventListener('click',e=>{if(e.target.closest('[data-action="auto"]')){e.preventDefault();openAutomationModal();}},true);
    document.addEventListener('input',e=>{if(e.target.matches('input[data-rating]')){e.stopPropagation();setRating(e.target.dataset.rating,e.target.value,false);}},true);
    document.addEventListener('change',e=>{if(e.target.matches('input[data-rating]'))setRating(e.target.dataset.rating,e.target.value);},true);
    document.addEventListener('focusout',e=>{if(e.target.matches('input[data-rating]'))setRating(e.target.dataset.rating,e.target.value);},true);
    document.addEventListener('keydown',e=>{if(e.target.matches('input[data-rating]')&&e.key==='Enter'){e.preventDefault();setRating(e.target.dataset.rating,e.target.value);}},true);
    document.addEventListener('input',e=>{if(e.target.matches('input[data-rating-final]'))e.stopPropagation();},true);
    document.addEventListener('change',e=>{if(e.target.matches('input[data-rating-final]'))setRating(e.target.dataset.ratingFinal,e.target.value);},true);
    document.addEventListener('focusout',e=>{if(e.target.matches('input[data-rating-final]'))setRating(e.target.dataset.ratingFinal,e.target.value);},true);
    document.addEventListener('keydown',e=>{if(e.target.matches('input[data-rating-final]')&&e.key==='Enter'){e.preventDefault();setRating(e.target.dataset.ratingFinal,e.target.value);}},true);
    render();
    /* En iOS no existe «cerrar la app»: lo último que se garantiza es el momento en que
       la pantalla se oculta, así que ahí se confirma la nota en foco y se fuerza el envío. */
    window.addEventListener('blur',()=>{commitFocusedRating();guardarLocal();});
    window.addEventListener('pagehide',()=>{commitFocusedRating();flushDisk({keepalive:true});});
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='hidden'){commitFocusedRating();flushDisk({keepalive:true});}
      else{pintarSync();sincronizar();}});
    bootDisk().then(()=>{if(necesitaConfiguracion())abrirModalGrupo();});
    if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  })();
  </script>
